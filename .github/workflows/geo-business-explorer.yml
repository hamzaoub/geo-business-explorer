name: Geo Business Explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run Overture worker tests
        run: python -m unittest discover -s worker -p "test_*.py"
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Test direct drag-to-select and JSON results in browser
        run: npm run test:e2e
      - name: Upload browser test traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geoscout-browser-test-results
          path: test-results/
          retention-days: 7

